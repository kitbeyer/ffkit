<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FFKit · Sleeper Live Scoreboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <!-- User Prompt Modal / Landing Screen -->
  <div id="auth-overlay" class="auth-overlay">
    <div class="auth-card">
      <div class="auth-brand">
        <div class="brand-icon">🏈</div>
        <div>
          <h1>FFKit Live</h1>
          <p class="auth-subtitle">Sleeper Live Scoreboard &amp; Best Ball Optimizer</p>
        </div>
      </div>

      <form id="user-form" class="auth-form">
        <label for="user-input">Sleeper User ID or Username</label>
        <div class="input-row">
          <input
            id="user-input"
            type="text"
            placeholder="e.g. kitshicker or 469286328278708224"
            autocomplete="off"
            required
          />
          <button type="submit" id="user-submit-btn" class="btn-primary">Load Leagues</button>
        </div>
        <div class="auth-meta-row">
          <label class="inline-label" for="auth-season">Season</label>
          <select id="auth-season" class="select-compact"></select>
        </div>
        <div id="auth-error" class="auth-error hidden"></div>
      </form>
    </div>
  </div>

  <!-- Main App Shell -->
  <div id="app-shell" class="app-shell hidden">
    <header class="topbar">
      <div class="brand-compact">
        <span class="brand-dot"></span>
        <span class="brand-title">FFKit Live</span>
      </div>

      <div class="topbar-controls">
        <div class="control-group">
          <label for="season-select">Season</label>
          <select id="season-select" class="select-compact"></select>
        </div>
        <div class="control-group">
          <label for="week-select">Week</label>
          <div class="week-stepper">
            <button type="button" id="week-prev-btn" class="week-nav-btn" title="Previous week" aria-label="Previous week">‹</button>
            <select id="week-select" class="select-compact week-select-inline" aria-label="Select week"></select>
            <button type="button" id="week-next-btn" class="week-nav-btn" title="Next week" aria-label="Next week">›</button>
          </div>
        </div>
        <button id="auto-refresh-btn" class="btn-toggle" title="Auto-refresh every 30 seconds" aria-label="Toggle 30s live updates">
          <span class="pulse-dot"></span>
          <span class="btn-label">Live 30s</span>
        </button>
        <button id="refresh-btn" class="btn-secondary" title="Refresh scores &amp; projections now" aria-label="Refresh">
          <svg class="btn-svg-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 12a9 9 0 1 1-2.64-6.36" />
            <polyline points="21 3 21 9 15 9" />
          </svg>
          <span class="btn-label">Refresh</span>
        </button>
        <span id="last-updated" class="last-updated"></span>
      </div>

      <div class="topbar-user-actions">
        <button id="theme-toggle-btn" class="btn-secondary" title="Toggle light / dark mode" aria-label="Toggle light or dark mode">
          <span class="btn-icon">🌙</span>
          <span class="btn-label">Dark</span>
        </button>
        <div id="user-chip" class="user-chip" title="Click to switch Sleeper user">
          <img id="user-avatar" class="avatar-xs hidden" alt="" />
          <div id="user-initials" class="avatar-xs avatar-fallback"></div>
          <span id="user-display-name"></span>
          <span class="chip-action">Switch</span>
        </div>
      </div>
    </header>

    <div class="workspace">
      <!-- Leftmost Pane: Current League Switcher + League Scoreboard -->
      <aside class="leagues-pane">
        <div id="league-switcher-wrap" class="league-switcher-wrap">
          <div class="pane-header">
            <h2>League</h2>
            <span id="leagues-count" class="count-pill">0</span>
          </div>
          <div id="current-league-slot" class="current-league-slot"></div>
          <div id="leagues-dropdown" class="leagues-dropdown hidden"></div>
        </div>

        <div class="scoreboard-section">
          <div class="pane-header">
            <h2 id="scoreboard-heading">Scoreboard</h2>
            <div class="pane-header-actions">
              <button id="odds-toggle-btn" class="btn-chip active" title="Show or hide live betting odds">Odds</button>
              <span id="matchups-count" class="count-pill">0</span>
            </div>
          </div>
          <div id="matchups-strip" class="scoreboard-list"></div>
        </div>
      </aside>

      <!-- Right Pane: Active League Bar + Selected Matchup Detail -->
      <main class="main-pane">
        <div class="detail-topbar">
          <div id="active-league-title" class="active-league-title">Select a league</div>
          <div id="active-league-badges" class="badge-row"></div>
        </div>

        <section id="matchup-detail" class="matchup-detail">
          <div class="empty-state">Select a league and matchup to inspect live scores and projections.</div>
        </section>
      </main>
    </div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
